# =====================================================================
# ontology.yaml — オントロジー定義
#   ObjectType / LinkType / ActionType をここに宣言する。
#   サーバーはこのファイルだけを読んで動くので、型を足しても
#   コードは変更しない。起動時にスキーマと参照整合性を検証する。
# =====================================================================

version: 1

object_types:
  Customer:
    description: 取引先の顧客
    key: customer_id
    properties:
      # enum は昇順に並べる ($next_enum が次の値へ進める)
      name:  {type: string,  required: true}
      tier:  {type: enum,    values: [bronze, silver, gold], required: true}
      email: {type: string}

  Order:
    description: 顧客からの注文
    key: order_id
    properties:
      amount: {type: integer, required: true}
      status: {type: enum, values: [open, shipped, cancelled], required: true}
      note:   {type: string}

  Product:
    description: 注文に含まれる商品
    key: product_id
    properties:
      name:     {type: string,  required: true}
      stock:    {type: integer, required: true}
      price:    {type: integer, required: true}
      category: {type: enum, values: [parts, tools, consumables], required: true}

link_types:
  places:
    description: 顧客が注文を行う
    from: Customer
    to: Order
    cardinality: one_to_many

  contains:
    description: 注文に商品が含まれる
    from: Order
    to: Product
    cardinality: many_to_many

action_types:
  cancel_order:
    description: 未出荷の注文をキャンセルする
    target: Order
    parameters:
      reason: {type: string, required: true}
    preconditions:
      - {property: status, op: eq, value: open}
    effects:
      status: cancelled
      note: $params.reason

  ship_order:
    description: 注文を出荷済みにする
    target: Order
    preconditions:
      - {property: status, op: eq, value: open}
    effects:
      status: shipped

  upgrade_tier:
    description: 顧客のティアを一段階上げる (bronze→silver→gold)
    target: Customer
    preconditions:
      - {property: tier, op: ne, value: gold}
    effects:
      tier: $next_enum   # enum の次の値へ進める組み込み効果

  restock:
    description: 在庫が 10 未満の商品を 100 まで補充する
    target: Product
    preconditions:
      - {property: stock, op: lt, value: 10}
    effects:
      stock: 100
